<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="800" height="300" fill="#FFFFFF"/>

  <g fill="none" stroke="#1F263E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Speed Lines on the left -->
    <line x1="100" y1="140" x2="160" y2="140" />
    <line x1="80" y1="165" x2="140" y2="165" />
    <line x1="110" y1="190" x2="150" y2="190" />

    <!-- Connecting route line flowing into the text -->
    <path d="M 160 165 C 190 165, 190 200, 220 200 L 260 200 C 290 200, 290 170, 320 170" />

    <!-- Location Pin Icon -->
    <g transform="translate(195, 95)">
      <!-- Outer pin shell -->
      <path d="M 35 0 C 15.67 0 0 15.67 0 35 C 0 55 35 85 35 85 C 35 85 70 55 70 35 C 70 15.67 54.33 0 35 0 Z" fill="none" stroke="#1F263E" stroke-width="11"/>
      <!-- Inner pin dot -->
      <circle cx="35" cy="35" r="7" fill="#1F263E" stroke="none" />
    </g>
  </g>

  <!-- Transliterated English Logo Text matching the visual style -->
  <text x="325" y="195"
        font-family="'Comfortaa', 'Quicksand', 'Nunito', 'Montserrat', sans-serif"
        font-size="115"
        font-weight="700"
        fill="#01C0AA"
        letter-spacing="2">Waslni</text>
</svg>
